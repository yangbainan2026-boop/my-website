<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>有你互动 EC 综合看板</title>
  <style>
    :root { color-scheme: dark; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #061321; color: #e6f4fc; font: 16px/1.5 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 440px); padding: 28px; box-sizing: border-box; background: #0b2135; border: 1px solid #2c5a72; border-radius: 12px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #b6d4e5; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    a { padding: 8px 13px; border: 1px solid #399bae; border-radius: 6px; color: #d1f9ff; text-decoration: none; }
    a:first-child { background: #0d6577; color: #fff; }
    a:hover, a:focus-visible { outline: 2px solid #99f1ff; outline-offset: 3px; }
    .hint { margin: 16px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>有你互动 EC 系统</h1>
    <p id="entry-status" role="status" aria-live="polite">正在确认当前 EC 入口…</p>
    <nav aria-label="EC 备用入口">
      <a id="ec-board" href="https://ruling-interactive-components-keywords.trycloudflare.com/ec-board">备用：综合看板</a>
      <a id="ec-admin" href="https://ruling-interactive-components-keywords.trycloudflare.com/admin">备用：管理后台</a>
      <a id="ec-reports" href="https://ruling-interactive-components-keywords.trycloudflare.com/ec-reports">备用：周报 / 月报</a>
    </nav>
    <p id="entry-hint" class="hint">上方为本页发布时的备用地址。若自动连接失败，可手动尝试；备用地址也可能失效。</p>
    <noscript><p class="hint">浏览器未启用 JavaScript，无法确认最新地址。请手动选择上方备用入口；若不可用，请刷新此固定入口后重试。</p></noscript>
  </main>
  <script>
    (async () => {
      'use strict';
      const routes = {
        default: { path: '/ec-board', id: 'ec-board', label: '综合看板' },
        admin: { path: '/admin', id: 'ec-admin', label: '管理后台' },
        reports: { path: '/ec-reports', id: 'ec-reports', label: '周报 / 月报' }
      };
      const entry = new URLSearchParams(location.search).get('entry');
      const mode = entry === 'admin' ? 'admin' : entry === 'reports' ? 'reports' : 'default';
      const status = document.getElementById('entry-status');
      const hint = document.getElementById('entry-hint');

      function validateOrigin(value) {
        if (typeof value !== 'string') throw new Error('Invalid origin');
        const url = new URL(value);
        const host = url.hostname;
        const suffix = '.trycloudflare.com';
        const label = host.slice(0, -suffix.length);
        if (url.protocol !== 'https:' || url.origin !== value || url.port ||
            url.username || url.password || url.pathname !== '/' || url.search || url.hash ||
            !host.endsWith(suffix) || label === 'api' || label.length > 63 ||
            !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(label)) {
          throw new Error('Unapproved origin');
        }
        return url.origin;
      }

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const configUrl = new URL('../origin.json', location.href);
        configUrl.searchParams.set('_', Date.now().toString());
        const response = await fetch(configUrl.href, {
          cache: 'no-store', credentials: 'omit', redirect: 'error', signal: controller.signal
        });
        if (!response.ok) throw new Error('Entry unavailable');
        const config = await response.json();
        if (!config || config.schema_version !== 1) throw new Error('Invalid entry configuration');
        const origin = validateOrigin(config.origin);
        for (const route of Object.values(routes)) {
          const link = document.getElementById(route.id);
          link.href = new URL(route.path, origin).href;
          link.textContent = route.label;
        }
        status.textContent = '正在打开 EC ' + routes[mode].label + '…';
        hint.textContent = '已确认当前入口。若未自动打开，请点击上方对应链接。';
        location.replace(new URL(routes[mode].path, origin).href);
      } catch (_) {
        status.textContent = '暂时无法确认当前 EC 地址，已暂停自动跳转。';
        hint.textContent = '请刷新此固定入口重试；上方为本页发布时的备用地址，可能已失效，仅供手动尝试。';
      } finally {
        clearTimeout(timeout);
      }
    })();
  </script>
</body>
</html>
