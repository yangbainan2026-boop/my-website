<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>有你互动 EC 综合看板</title>
  <style>
    :root { color-scheme: dark; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #061321; color: #e6f4fc; font: 16px/1.5 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 440px); padding: 28px; box-sizing: border-box; background: #0b2135; border: 1px solid #2c5a72; border-radius: 12px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #b6d4e5; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    a { padding: 8px 13px; border: 1px solid #399bae; border-radius: 6px; color: #d1f9ff; text-decoration: none; }
    a:first-child { background: #0d6577; color: #fff; }
    a:hover, a:focus-visible { outline: 2px solid #99f1ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>有你互动 EC 系统</h1>
    <p id="entry-status">登录后查看真实 EC 数据。</p>
    <nav aria-label="EC 入口">
      <a id="ec-board" href="https://organised-compiled-born-requires.trycloudflare.com/ec-board">EC 登录</a>
      <a id="ec-admin" href="https://organised-compiled-born-requires.trycloudflare.com/admin">EC 管理后台</a>
    </nav>
  </main>
  <script>
    const entry = new URLSearchParams(location.search).get('entry');
    const admin = entry === 'admin';
    if (entry === 'reports') {
      const board = document.getElementById('ec-board');
      board.href = new URL('/ec-reports', board.href).href;
      board.textContent = '个人周报 / 月报';
    }
    document.getElementById('entry-status').textContent = admin ? '正在打开 EC 管理后台…' : entry === 'reports' ? '正在打开个人周报 / 月报…' : '正在打开 EC 综合看板…';
    location.replace(document.getElementById(admin ? 'ec-admin' : 'ec-board').href);
  </script>
</body>
</html>
